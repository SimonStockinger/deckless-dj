[package]
name = "deckless-dj"
version = "0.1.0"
description = "Apollon - keyboard-driven DJ software"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
cpal = "0.15"
symphonia = { version = "0.5", features = ["all"] }
rtrb = "0.3"          # Lock-free Single-Producer Single-Consumer ring buffer
biquad = "0.4"        # 3-band EQ (Low, Mid, High) and Filter sweeps
rubato = "0.15"       # Pitch-independent time stretching
rusqlite = { version = "0.31", features = ["bundled"] }

[profile.dev.package."*"]
opt-level = 3         # Keep DSP dependencies fast in debug builds to avoid audio dropouts
